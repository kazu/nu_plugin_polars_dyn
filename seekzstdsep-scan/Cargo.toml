[package]
name = "seekzstdsep_scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "The seekable zstd (.seek.zst) scan source for nu_plugin_polars_dyn: a compressed file as the bytes it decompresses to."
repository = "https://github.com/kazu/nu_plugin_polars_dyn"

[lib]
bench = false

[dependencies]
nu_plugin_polars_dyn = { version = "=0.3.0", path = ".." }
polars = { version = "=0.55.2", features = ["lazy"] }
zeekstd = "=0.6.2"

[lints.clippy]
unwrap_used = "deny"
