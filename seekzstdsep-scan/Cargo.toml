[package]
name = "seekzstdsep_scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
description = "The seekable zstd (.seek.zst) scan source for nu_plugin_polars_dyn: a compressed file as the records it decompresses to."
repository = "https://github.com/kazu/nu_plugin_polars_dyn"

[lib]
bench = false

[dependencies]
memchr = "=2.8.3"
nu_plugin_polars_dyn = { version = "=0.4.2", path = ".." }
polars = { version = "=0.55.2", features = ["lazy"] }
seekzstdsep = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.clippy]
unwrap_used = "deny"
