[package]
name = "ssh_scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "The ssh:// scan source for nu_plugin_polars_dyn: a remote file over sftp as the bytes a chain reads."
repository = "https://github.com/kazu/nu_plugin_polars_dyn"

[lib]
bench = false

[dependencies]
nu_plugin_polars_dyn = { version = "=0.3.1", path = ".." }
polars = { version = "=0.55.2", features = ["lazy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ssh2 = "=0.9.6"

[lints.clippy]
unwrap_used = "deny"
